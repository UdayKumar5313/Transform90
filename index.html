<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uday's 90-Day Transformation</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Hide scrollbar for horizontal scrolling containers */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            background-color: #020617; /* slate-950 */
            color: #f1f5f9; /* slate-100 */
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="pb-24 md:pb-0 selection:bg-emerald-500/30">

    <!-- Header will be rendered here -->
    <div id="header-container"></div>

    <!-- Main Content Area -->
    <main id="app-content" class="max-w-4xl mx-auto p-4 md:p-6 fade-in"></main>

    <!-- Floating Timer (Hidden by default) -->
    <div id="floating-timer" class="hidden fixed bottom-24 md:bottom-6 right-4 md:right-6 bg-slate-900 border-2 border-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.3)] rounded-full px-6 py-3 items-center gap-3 z-50">
        <i class="fa-solid fa-stopwatch text-emerald-400 text-2xl animate-pulse"></i>
        <div class="flex flex-col">
            <span class="text-[10px] uppercase font-bold text-emerald-500 tracking-wider">Rest</span>
            <span id="timer-text" class="text-xl font-black text-white leading-none">0s</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around p-2 z-50 md:hidden pb-safe" id="mobile-nav"></nav>
    
    <div class="hidden md:flex justify-center gap-4 fixed bottom-8 left-0 right-0 z-50 pointer-events-none">
        <div class="bg-slate-900/90 backdrop-blur border border-slate-700 rounded-2xl p-2 flex shadow-2xl gap-2 pointer-events-auto" id="desktop-nav"></div>
    </div>

    <script>
        // --- 1. DATA STRUCTURES ---

        const TIMETABLE = [
            { id: 't1', time: '6:30 AM', activity: 'Wake Up', details: 'Drink 500 ml water. Start the engine.', icon: 'fa-sun' },
            { id: 't2', time: '6:40 AM', activity: 'Sunlight', details: '10 mins outdoor sunlight.', icon: 'fa-sun' },
            { id: 't3', time: '7:00 AM', activity: 'Pre-Breakfast', details: '1 banana + 5 almonds + 300 ml water.', icon: 'fa-utensils' },
            { id: 't4', time: '8:00 AM', activity: 'Breakfast', details: 'Oats, milk, peanuts, and eggs (3 whole, 2 white).', icon: 'fa-utensils' },
            { id: 't5', time: '11:00 AM', activity: 'Snack', details: '1 banana or 1 apple.', icon: 'fa-utensils' },
            { id: 't6', time: '1:30 PM', activity: 'Lunch', details: 'Rice, dal, vegetables, soya chunks, curd.', icon: 'fa-utensils' },
            { id: 't7', time: '2:00 PM', activity: 'Walk', details: '10-minute slow walk for digestion.', icon: 'fa-person-walking' },
            { id: 't8', time: '4:30 PM', activity: 'Pre-Workout', details: '1 banana + 1 cup black coffee.', icon: 'fa-fire' },
            { id: 't9', time: '5:00 PM', activity: 'Workout', details: 'Follow daily routine.', icon: 'fa-dumbbell' },
            { id: 't10', time: '6:00 PM', activity: 'Post-Workout', details: '3 boiled eggs + 500 ml water.', icon: 'fa-utensils' },
            { id: 't11', time: '7:00 PM', activity: 'Walk', details: '15–20 minutes brisk walking.', icon: 'fa-person-walking' },
            { id: 't12', time: '8:30 PM', activity: 'Dinner', details: 'Rice, dal, vegetables, 3 eggs.', icon: 'fa-utensils' },
            { id: 't13', time: '10:00 PM', activity: 'Before Bed', details: '100g curd + 300 ml water.', icon: 'fa-moon' },
        ];

        const WATER_SCHEDULE = [
            { id: 'w1', time: 'Wake Up', amount: 500 }, { id: 'w2', time: 'Breakfast', amount: 300 },
            { id: 'w3', time: 'Morning', amount: 700 }, { id: 'w4', time: 'Lunch', amount: 300 },
            { id: 'w5', time: 'Afternoon', amount: 500 }, { id: 'w6', time: 'Workout', amount: 500 },
            { id: 'w7', time: 'Dinner', amount: 200 }, { id: 'w8', time: 'Before Bed', amount: 300 },
        ];

        const MEALS = {
            breakfast: { title: 'Power Breakfast', time: '8:00 AM', items: [
                { id: 'm1', name: 'Oats (80g)', protein: 10, cals: 310 }, { id: 'm2', name: 'Milk (300ml)', protein: 10, cals: 180 },
                { id: 'm3', name: 'Peanuts (15g)', protein: 4, cals: 85 }, { id: 'm4', name: 'Whole Eggs (3)', protein: 18, cals: 210 },
                { id: 'm5', name: 'Egg Whites (2)', protein: 8, cals: 35 },
            ]},
            lunch: { title: 'Muscle-Building Lunch', time: '1:30 PM', items: [
                { id: 'm6', name: 'Cooked Rice (250g)', protein: 5, cals: 325 }, { id: 'm7', name: 'Dal (150g)', protein: 8, cals: 150 },
                { id: 'm8', name: 'Vegetables (1 Bowl)', protein: 2, cals: 50 }, { id: 'm9', name: 'Soya Chunks (60g)', protein: 30, cals: 200 },
                { id: 'm10', name: 'Curd (100g)', protein: 4, cals: 60 },
            ]},
            dinner: { title: 'Recovery Dinner', time: '8:30 PM', items: [
                { id: 'm11', name: 'Cooked Rice (200g)', protein: 4, cals: 260 }, { id: 'm12', name: 'Dal (150g)', protein: 8, cals: 150 },
                { id: 'm13', name: 'Vegetables (1 Bowl)', protein: 2, cals: 50 }, { id: 'm14', name: 'Whole Eggs (3)', protein: 18, cals: 210 },
            ]},
            snacks: { title: 'Pre/Post Workout Snacks', time: 'Various', items: [
                { id: 'm15', name: 'Bananas (2)', protein: 2, cals: 210 }, { id: 'm16', name: 'Almonds (5)', protein: 1, cals: 35 },
                { id: 'm17', name: 'Boiled Eggs (3)', protein: 18, cals: 210 }, { id: 'm18', name: 'Curd before bed (100g)', protein: 4, cals: 60 },
            ]}
        };

        const GROCERY_LIST = [
            { category: 'Proteins', items: ['Eggs (Tray of 30+)', 'Soya Chunks (500g)', 'Milk (3-4 Liters/week)', 'Curd (1.5kg/week)'] },
            { category: 'Carbs & Fats', items: ['Oats (1kg)', 'White/Brown Rice', 'Dal / Lentils (1kg)', 'Peanuts (250g)', 'Almonds (100g)'] },
            { category: 'Produce', items: ['Bananas (Dozen)', 'Apples', 'Mixed Vegetables (Spinach, Carrots, Beans)'] },
            { category: 'Extras', items: ['Black Coffee Powder'] }
        ];

        const BASE_WORKOUTS = {
            Monday: { focus: 'Chest + Shoulders + Triceps', duration: '60 min', time: '5:00 PM', routine: [
                { id: 'w_m1', name: 'Push-ups', sets: 4, reps: '10' }, { id: 'w_m2', name: 'Incline Push-ups', sets: 3, reps: '12' },
                { id: 'w_m3', name: 'Pike Push-ups', sets: 3, reps: '8' }, { id: 'w_m4', name: 'Chair Dips', sets: 3, reps: '10' },
                { id: 'w_m5', name: 'Water Bottle Lateral Raises', sets: 3, reps: '15' },
            ]},
            Tuesday: { focus: 'Back + Biceps', duration: '60 min', time: '5:00 PM', routine: [
                { id: 'w_t1', name: 'Backpack Rows', sets: 4, reps: '12' }, { id: 'w_t2', name: 'Towel Rows', sets: 3, reps: '12' },
                { id: 'w_t3', name: 'Backpack Curls', sets: 3, reps: '15' }, { id: 'w_t4', name: 'Superman Hold', sets: 3, reps: '30s' },
            ]},
            Wednesday: { focus: 'Legs + Abs', duration: '60 min', time: '5:00 PM', routine: [
                { id: 'w_w1', name: 'Squats', sets: 4, reps: '20' }, { id: 'w_w2', name: 'Lunges', sets: 3, reps: '12/leg' },
                { id: 'w_w3', name: 'Glute Bridges', sets: 3, reps: '15' }, { id: 'w_w4', name: 'Calf Raises', sets: 4, reps: '25' },
                { id: 'w_w5', name: 'Leg Raises', sets: 3, reps: '15' },
            ]},
            Thursday: { focus: 'Cardio', duration: '45 min', time: '5:00 PM', routine: [
                { id: 'w_th1', name: 'Brisk Walk or Jog', sets: 1, reps: '45 min' },
            ]},
            Friday: { focus: 'Upper Body', duration: '60 min', time: '5:00 PM', routine: [
                { id: 'w_f1', name: 'Push-ups', sets: 5, reps: '12' }, { id: 'w_f2', name: 'Pike Push-ups', sets: 4, reps: '10' },
                { id: 'w_f3', name: 'Backpack Rows', sets: 4, reps: '15' }, { id: 'w_f4', name: 'Chair Dips', sets: 4, reps: '12' },
                { id: 'w_f5', name: 'Lateral Raises', sets: 4, reps: '15' },
            ]},
            Saturday: { focus: 'Cardio + Abs', duration: '45 min', time: '5:00 PM', routine: [
                { id: 'w_s1', name: 'Brisk Walking', sets: 1, reps: '40 min' }, { id: 'w_s2', name: 'Leg Raises', sets: 3, reps: '15' },
                { id: 'w_s3', name: 'Russian Twists', sets: 3, reps: '20' }, { id: 'w_s4', name: 'Plank', sets: 3, reps: '60s' },
            ]},
            Sunday: { focus: 'Rest', duration: 'Recovery', time: 'Anytime', routine: [
                { id: 'w_su1', name: 'Active Recovery Walk', sets: 1, reps: '15 min' }, { id: 'w_su2', name: 'Full Body Stretch', sets: 1, reps: '15 min' },
            ]}
        };

        const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        // --- 2. STATE MANAGEMENT ---
        const state = {
            activeTab: 'daily',
            currentWeek: 1,
            strictMode: true,
            completedTasks: new Set(),
            completedWater: new Set(),
            consumedDiet: new Set(),
            completedSets: new Set(),
            energyLevel: 0,
            sleepBed: '22:30',
            sleepWake: '06:30',
            weight: 56.2,
            showGrocery: false,
            workoutDay: DAYS_OF_WEEK[new Date().getDay()],
            history: {}, 
            restTimer: 0,
            timerInterval: null
        };

        // --- 3. UTILITIES ---

        function hasTimePassed(timeString) {
            if (!timeString || !timeString.includes(':')) return true;
            const now = new Date();
            const parts = timeString.split(' ');
            if(parts.length < 2) return true;
            const time = parts[0];
            const modifier = parts[1];
            
            let [hours, minutes] = time.split(':');
            hours = parseInt(hours, 10);
            minutes = parseInt(minutes, 10);

            if (hours === 12 && modifier === 'AM') hours = 0;
            if (hours !== 12 && modifier === 'PM') hours += 12;

            const taskTime = new Date();
            taskTime.setHours(hours, minutes, 0, 0);

            return now >= taskTime;
        }

        function getDynamicWorkouts(week) {
            const dynamic = JSON.parse(JSON.stringify(BASE_WORKOUTS));
            Object.keys(dynamic).forEach(day => {
                const workout = dynamic[day];
                if (workout.focus === 'Rest' || workout.focus === 'Cardio') return;

                workout.routine.forEach(ex => {
                    if (week >= 3) {
                        if (ex.reps.includes('/leg')) { ex.reps = `${parseInt(ex.reps) + 2}/leg`; } 
                        else if (!ex.reps.includes('s') && !ex.reps.includes('min')) { ex.reps = `${parseInt(ex.reps) + 2}`; }
                    }
                    if (week >= 5) {
                        if (['Squats', 'Lunges', 'Glute Bridges', 'Calf Raises', 'Towel Rows'].includes(ex.name)) { ex.name += ' 🎒 (+Wt)'; }
                    }
                    if (week >= 7) { ex.sets = parseInt(ex.sets) + 1; }
                });
                workout.restTimer = week >= 9 ? 45 : 60;
            });
            return dynamic;
        }

        function calculateScore() {
            const taskScore = (state.completedTasks.size / TIMETABLE.length) * 20;
            const waterScore = (state.completedWater.size / WATER_SCHEDULE.length) * 20;
            
            let totalDietItems = 0;
            Object.values(MEALS).forEach(m => totalDietItems += m.items.length);
            const dietScore = (state.consumedDiet.size / totalDietItems) * 30;

            const todayWorkout = getDynamicWorkouts(state.currentWeek)[DAYS_OF_WEEK[new Date().getDay()]];
            let totalSets = 0;
            todayWorkout.routine.forEach(ex => totalSets += (ex.sets !== '-' ? ex.sets : 0));
            const workoutScore = totalSets > 0 ? (state.completedSets.size / totalSets) * 30 : 30; // If rest day, full points

            return Math.min(100, taskScore + waterScore + dietScore + workoutScore);
        }

        function updateHistory() {
            const todayStr = new Date().toISOString().split('T')[0];
            state.history[todayStr] = {
                score: calculateScore(),
                weight: state.weight,
                energyLevel: state.energyLevel
            };
        }

        // --- 4. GLOBAL ACTIONS ---
        const app = {
            setTab: (tab) => { state.activeTab = tab; renderApp(); },
            toggleStrictMode: () => { state.strictMode = !state.strictMode; renderApp(); },
            toggleTask: (id) => { 
                if (state.completedTasks.has(id)) state.completedTasks.delete(id); else state.completedTasks.add(id);
                updateHistory(); renderApp(); 
            },
            toggleWater: (id) => {
                if (state.completedWater.has(id)) state.completedWater.delete(id); else state.completedWater.add(id);
                updateHistory(); renderApp();
            },
            toggleDiet: (id) => {
                if (state.consumedDiet.has(id)) state.consumedDiet.delete(id); else state.consumedDiet.add(id);
                updateHistory(); renderApp();
            },
            toggleSet: (exId, setIdx, restSecs) => {
                const setId = `${exId}_${setIdx}`;
                if (state.completedSets.has(setId)) {
                    state.completedSets.delete(setId);
                } else {
                    state.completedSets.add(setId);
                    app.startRestTimer(restSecs);
                }
                updateHistory(); renderApp();
            },
            setEnergy: (lvl) => { state.energyLevel = lvl; updateHistory(); renderApp(); },
            setSleepBed: (val) => { state.sleepBed = val; renderApp(); },
            setSleepWake: (val) => { state.sleepWake = val; renderApp(); },
            setWeight: (val) => { state.weight = parseFloat(val); updateHistory(); renderStats(); },
            setWeek: (val) => { state.currentWeek = parseInt(val); renderApp(); },
            setWorkoutDay: (day) => { state.workoutDay = day; renderApp(); },
            toggleGrocery: (show) => { state.showGrocery = show; renderApp(); },
            
            startRestTimer: (seconds) => {
                state.restTimer = seconds;
                if(state.timerInterval) clearInterval(state.timerInterval);
                
                const timerEl = document.getElementById('floating-timer');
                const textEl = document.getElementById('timer-text');
                
                timerEl.classList.remove('hidden');
                timerEl.classList.add('flex');
                textEl.innerText = `${state.restTimer}s`;

                state.timerInterval = setInterval(() => {
                    state.restTimer--;
                    if(state.restTimer <= 0) {
                        clearInterval(state.timerInterval);
                        timerEl.classList.add('hidden');
                        timerEl.classList.remove('flex');
                    } else {
                        textEl.innerText = `${state.restTimer}s`;
                    }
                }, 1000);
            }
        };

        // --- 5. RENDER FUNCTIONS ---

        function renderHeader() {
            const score = calculateScore();
            const headerHtml = `
                <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40 shadow-lg">
                    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex justify-between items-center w-full sm:w-auto">
                            <div>
                                <h1 class="text-xl font-black text-white flex items-center gap-2">
                                    <i class="fa-solid fa-bullseye text-emerald-500"></i> 100x Precision Plan
                                </h1>
                                <p class="text-xs text-slate-400 mt-0.5 font-medium">Uday • Day 1 of 90</p>
                            </div>
                            
                            <button onclick="app.toggleStrictMode()" class="flex sm:hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${state.strictMode ? 'bg-blue-900/20 text-blue-400 border-blue-900/50' : 'bg-orange-900/20 text-orange-400 border-orange-900/50'}">
                                <i class="fa-solid ${state.strictMode ? 'fa-lock' : 'fa-lock-open'}"></i>
                                ${state.strictMode ? 'Strict' : 'Flexible'}
                            </button>
                        </div>
                        
                        <div class="flex items-center gap-4 justify-between sm:justify-end w-full sm:w-auto">
                            <button onclick="app.toggleStrictMode()" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${state.strictMode ? 'bg-blue-900/20 text-blue-400 border-blue-900/50' : 'bg-orange-900/20 text-orange-400 border-orange-900/50'}">
                                <i class="fa-solid ${state.strictMode ? 'fa-lock' : 'fa-lock-open'}"></i>
                                ${state.strictMode ? 'Strict Mode' : 'Flexible Mode'}
                            </button>

                            <div class="text-right flex flex-col items-end w-full sm:w-auto">
                                <div class="text-sm font-black text-emerald-400 flex items-center gap-1">
                                    <i class="fa-solid fa-bolt"></i> Accuracy: ${Math.round(score)}%
                                </div>
                                <div class="w-full sm:w-24 h-1.5 bg-slate-800 rounded-full mt-1.5 overflow-hidden">
                                    <div class="h-full bg-emerald-500 transition-all duration-500" style="width: ${score}%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            `;
            document.getElementById('header-container').innerHTML = headerHtml;
        }

        function renderNav() {
            const navItems = [
                { id: 'daily', icon: 'fa-clock', label: 'Daily' },
                { id: 'diet', icon: 'fa-utensils', label: 'Diet' },
                { id: 'workout', icon: 'fa-dumbbell', label: 'Train' },
                { id: 'stats', icon: 'fa-calendar', label: 'Stats' },
            ];

            let html = '';
            navItems.forEach(item => {
                const isActive = state.activeTab === item.id;
                html += `
                    <button onclick="app.setTab('${item.id}')" class="flex flex-col items-center justify-center w-16 sm:w-[72px] py-2 px-1 rounded-xl transition-all ${isActive ? 'text-emerald-400 bg-emerald-400/10' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}">
                        <i class="fa-solid ${item.icon} text-lg mb-1 ${isActive ? '' : 'opacity-80'}"></i>
                        <span class="text-[10px] font-semibold tracking-wide">${item.label}</span>
                    </button>
                `;
            });

            document.getElementById('mobile-nav').innerHTML = html;
            document.getElementById('desktop-nav').innerHTML = html;
        }

        function renderDaily() {
            // Sleep Calc
            let [bH, bM] = state.sleepBed.split(':').map(Number);
            let [wH, wM] = state.sleepWake.split(':').map(Number);
            if (wH < bH) wH += 24;
            const totalMins = (wH * 60 + wM) - (bH * 60 + bM);
            const sHrs = Math.floor(totalMins / 60);
            const sMins = totalMins % 60;
            const sleepOk = (totalMins / 60) >= 7;

            let html = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
                        <h3 class="text-sm font-bold text-slate-400 mb-3 flex items-center gap-2"><i class="fa-solid fa-bolt"></i> Morning Readiness</h3>
                        <div class="flex justify-between gap-2">
                            ${[1,2,3,4,5].map(lvl => `
                                <button onclick="app.setEnergy(${lvl})" class="flex-1 py-2 rounded-lg text-lg border transition-all ${state.energyLevel === lvl ? 'bg-orange-500/20 border-orange-500 text-orange-400' : 'bg-slate-800 border-slate-700 text-slate-500'}">
                                    ${lvl===1?'😫' : lvl===2?'🥱' : lvl===3?'😐' : lvl===4?'🙂' : '🔥'}
                                </button>
                            `).join('')}
                        </div>
                    </section>
                    <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-sm font-bold text-slate-400 flex items-center gap-2"><i class="fa-solid fa-moon"></i> Sleep Calculator</h3>
                            <span class="text-xs font-bold px-2 py-1 rounded ${sleepOk ? 'bg-emerald-900/40 text-emerald-400' : 'bg-red-900/40 text-red-400'}">${sHrs}h ${sMins}m</span>
                        </div>
                        <div class="flex gap-4 items-center">
                            <div class="flex-1">
                                <label class="text-[10px] uppercase text-slate-500 font-bold">Bed Time</label>
                                <input type="time" value="${state.sleepBed}" onchange="app.setSleepBed(this.value)" class="w-full bg-slate-800 text-white rounded p-2 text-sm outline-none border border-slate-700">
                            </div>
                            <div class="flex-1">
                                <label class="text-[10px] uppercase text-slate-500 font-bold">Wake Time</label>
                                <input type="time" value="${state.sleepWake}" onchange="app.setSleepWake(this.value)" class="w-full bg-slate-800 text-white rounded p-2 text-sm outline-none border border-slate-700">
                            </div>
                        </div>
                    </section>
                </div>

                <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800 mb-6">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-lg font-bold flex items-center gap-2 text-white"><i class="fa-solid fa-droplet text-blue-400"></i> Water Log</h2>
                        <span class="text-sm font-bold text-blue-400 bg-blue-900/30 px-3 py-1 rounded-full">${state.completedWater.size * 375} / 3000 ml</span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${WATER_SCHEDULE.map(item => {
                            const isDone = state.completedWater.has(item.id);
                            return `
                            <button onclick="app.toggleWater('${item.id}')" class="flex flex-col p-3 rounded-xl border transition-all text-left ${isDone ? 'bg-blue-900/40 border-blue-500/50 text-blue-200' : 'bg-slate-800/50 border-slate-700 text-slate-400'}">
                                <div class="flex justify-between items-start mb-2 w-full">
                                    <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider">${item.time}</span>
                                    <i class="fa-solid ${isDone ? 'fa-circle-check text-blue-400' : 'fa-circle opacity-40'}"></i>
                                </div>
                            </button>`;
                        }).join('')}
                    </div>
                </section>

                <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
                    <h2 class="text-lg font-bold mb-6 flex items-center gap-2 text-white"><i class="fa-solid fa-clock text-emerald-400"></i> Schedule</h2>
                    <div class="relative border-l-2 border-slate-800/80 ml-4 space-y-6 pb-2">
                        ${TIMETABLE.map(item => {
                            const isDone = state.completedTasks.has(item.id);
                            const isLocked = state.strictMode && !hasTimePassed(item.time);
                            return `
                            <div class="relative pl-6 flex items-start gap-3 group">
                                <button onclick="${!isLocked ? `app.toggleTask('${item.id}')` : ''}" ${isLocked ? 'disabled' : ''} class="absolute -left-[11px] top-0.5 rounded-full p-1 transition-all z-10 bg-slate-900 border-2 ${isLocked ? 'border-slate-800 text-slate-700 opacity-60' : isDone ? 'border-emerald-500 text-emerald-500' : 'border-slate-600 text-slate-600'}">
                                    <i class="fa-solid ${isLocked ? 'fa-lock text-xs' : isDone ? 'fa-circle-check text-xs' : 'fa-circle text-xs'}"></i>
                                </button>
                                <div class="flex-1 transition-all ${isLocked ? 'opacity-40 grayscale' : isDone ? 'opacity-50' : 'opacity-100'}">
                                    <div class="flex flex-wrap items-center gap-2 mb-1">
                                        <span class="text-xs font-bold text-slate-300 bg-slate-800 px-2 py-1 rounded-md">${item.time}</span>
                                        <h3 class="text-sm sm:text-base font-bold text-slate-100">${item.activity}</h3>
                                    </div>
                                    <p class="text-xs sm:text-sm text-slate-400 mt-1">${item.details}</p>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </section>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderDiet() {
            if (state.showGrocery) {
                let gHtml = `
                    <button onclick="app.toggleGrocery(false)" class="text-emerald-400 text-sm font-bold flex items-center gap-2 mb-4 hover:underline">
                        &larr; Back to Macro Counter
                    </button>
                    <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                        <h2 class="text-2xl font-black text-white flex items-center gap-3 mb-6"><i class="fa-solid fa-cart-shopping text-emerald-500"></i> Weekly Grocery List</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${GROCERY_LIST.map(sec => `
                                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                    <h3 class="font-bold text-slate-200 mb-3 border-b border-slate-700 pb-2">${sec.category}</h3>
                                    <ul class="space-y-2">
                                        ${sec.items.map(i => `<li class="flex items-center gap-2 text-sm text-slate-300"><i class="fa-solid fa-list-check text-emerald-500"></i> ${i}</li>`).join('')}
                                    </ul>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                document.getElementById('app-content').innerHTML = gHtml;
                return;
            }

            let totalPro = 0, totalCal = 0;
            Object.values(MEALS).forEach(meal => {
                meal.items.forEach(item => {
                    if (state.consumedDiet.has(item.id)) { totalPro += item.protein; totalCal += item.cals; }
                });
            });

            let dHtml = `
                <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                    <div>
                        <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Live Macros Today</h3>
                        <div class="flex gap-6">
                            <div class="flex flex-col">
                                <span class="text-3xl font-black text-red-400">${totalPro}<span class="text-sm font-medium text-slate-500 ml-1">/100g</span></span>
                                <span class="text-[10px] text-slate-500 font-bold uppercase">Protein</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-3xl font-black text-orange-400">${totalCal}<span class="text-sm font-medium text-slate-500 ml-1">/1800</span></span>
                                <span class="text-[10px] text-slate-500 font-bold uppercase">Calories</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="app.toggleGrocery(true)" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-cart-shopping"></i> Grocery List
                    </button>
                </div>
                <div class="space-y-4">
                    ${Object.entries(MEALS).map(([k, meal]) => `
                        <section class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                            <div class="p-4 border-b border-slate-800 bg-slate-800/30 flex justify-between items-center">
                                <h2 class="text-base font-bold text-white">${meal.title}</h2>
                                <span class="text-xs font-bold bg-slate-950 text-slate-400 px-2 py-1 rounded">${meal.time}</span>
                            </div>
                            <div class="p-2 space-y-1">
                                ${meal.items.map(item => {
                                    const isDone = state.consumedDiet.has(item.id);
                                    return `
                                    <button onclick="app.toggleDiet('${item.id}')" class="w-full flex items-center justify-between p-3 rounded-xl transition-colors border ${isDone ? 'bg-emerald-900/20 border-emerald-900/50' : 'bg-transparent border-transparent hover:bg-slate-800/50'}">
                                        <div class="flex items-center gap-3">
                                            <i class="fa-solid ${isDone ? 'fa-circle-check text-emerald-500' : 'fa-circle text-slate-600'} text-lg"></i>
                                            <span class="text-sm font-bold ${isDone ? 'text-slate-300' : 'text-slate-100'}">${item.name}</span>
                                        </div>
                                        <div class="flex gap-3 text-xs font-bold text-slate-500">
                                            <span class="w-12 text-right">${item.cals} kcal</span>
                                            <span class="w-10 text-right text-red-400/80">${item.protein}g</span>
                                        </div>
                                    </button>`;
                                }).join('')}
                            </div>
                        </section>
                    `).join('')}
                </div>
            `;
            document.getElementById('app-content').innerHTML = dHtml;
        }

        function renderWorkout() {
            const dynamicWorkouts = getDynamicWorkouts(state.currentWeek);
            const workout = dynamicWorkouts[state.workoutDay];

            let wHtml = `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between mb-6">
                    <div>
                        <h3 class="font-bold text-slate-200 text-sm">Progression Phase</h3>
                        <p class="text-[10px] text-slate-400">Controls sets, reps, and rest timers.</p>
                    </div>
                    <select onchange="app.setWeek(this.value)" class="bg-slate-800 text-emerald-400 border border-slate-700 rounded-lg px-3 py-2 text-sm font-bold outline-none">
                        ${[1,3,5,7,9,11].map(w => `<option value="${w}" ${state.currentWeek===w?'selected':''}>Weeks ${w}-${w+1}</option>`).join('')}
                    </select>
                </div>

                <div class="flex overflow-x-auto pb-2 -mx-4 px-4 md:mx-0 md:px-0 snap-x hide-scrollbar gap-2 mb-4">
                    ${Object.keys(dynamicWorkouts).map(day => `
                        <button onclick="app.setWorkoutDay('${day}')" class="snap-center shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition-all ${state.workoutDay === day ? 'bg-emerald-500 text-slate-950 border-emerald-500' : 'bg-slate-900 text-slate-400 border-slate-700'}">
                            ${day.substring(0,3).toUpperCase()}
                        </button>
                    `).join('')}
                </div>

                <section class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                    <div class="p-5 border-b border-slate-800 bg-slate-800/30">
                        <h2 class="text-xl font-black text-white mb-1">${state.workoutDay} <span class="text-emerald-400">•</span> ${workout.focus}</h2>
                        <div class="flex gap-3 text-xs font-bold text-slate-400">
                            <span><i class="fa-solid fa-stopwatch mr-1"></i> ${workout.duration}</span>
                            <span><i class="fa-solid fa-clock mr-1"></i> ${workout.time}</span>
                            <span class="text-blue-400"><i class="fa-solid fa-bolt mr-1"></i> Rest: ${workout.restTimer}s</span>
                        </div>
                    </div>
                    <div class="p-4 sm:p-5 space-y-4">
                        ${workout.routine.length > 0 ? workout.routine.map(ex => {
                            let setsHtml = '';
                            if (ex.sets !== '-') {
                                for(let i=0; i<ex.sets; i++) {
                                    const setId = `${ex.id}_${i}`;
                                    const isDone = state.completedSets.has(setId);
                                    setsHtml += `
                                        <button onclick="app.toggleSet('${ex.id}', ${i}, ${workout.restTimer})" class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold border transition-all flex-1 min-w-[60px] ${isDone ? 'bg-emerald-900/40 border-emerald-500/50 text-emerald-400' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}">
                                            ${isDone ? '<i class="fa-solid fa-circle-check"></i>' : `Set ${i+1}`}
                                        </button>
                                    `;
                                }
                            }
                            return `
                            <div class="bg-slate-800/40 rounded-xl border border-slate-700/50 p-4">
                                <div class="flex justify-between items-center mb-4">
                                    <h3 class="font-bold text-slate-100 text-sm">${ex.name}</h3>
                                    <span class="bg-slate-950 text-slate-300 text-xs font-bold px-2 py-1 rounded">Target: ${ex.reps} reps</span>
                                </div>
                                ${ex.sets !== '-' ? `<div class="flex flex-wrap gap-2">${setsHtml}</div>` : `<div class="text-xs text-slate-500 font-medium italic">Continuous movement. No sets tracked.</div>`}
                            </div>
                            `;
                        }).join('') : '<div class="text-center py-8 text-slate-500">Rest Day. No tracked sets.</div>'}
                    </div>
                </section>
            `;
            document.getElementById('app-content').innerHTML = wHtml;
        }

        function renderStats() {
            const isSunday = new Date().getDay() === 0;
            const daysArray = Array.from({ length: 90 }, (_, i) => i + 1);
            const historyKeys = Object.keys(state.history).sort();
            const daysActive = historyKeys.length;

            let gridHtml = '';
            daysArray.forEach(dayNum => {
                let bgColor = "bg-slate-800/30"; let borderColor = "border-slate-800/50";
                let tooltip = '';
                if (dayNum <= daysActive) {
                    const histDate = historyKeys[dayNum - 1];
                    const data = state.history[histDate];
                    if(data) {
                        if (data.score > 85) { bgColor = "bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"; borderColor = "border-emerald-400"; }
                        else if (data.score > 50) { bgColor = "bg-emerald-600/80"; borderColor = "border-emerald-500"; }
                        else if (data.score > 10) { bgColor = "bg-emerald-900/60"; borderColor = "border-emerald-800"; }
                        tooltip = `<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block z-20">
                                      <div class="bg-slate-800 text-white text-[10px] font-bold py-1 px-2 rounded shadow-xl whitespace-nowrap">Day ${dayNum} • Score: ${Math.round(data.score)}%</div>
                                   </div>`;
                    }
                }
                gridHtml += `<div class="w-[18px] h-[18px] rounded-[4px] border ${bgColor} ${borderColor} transition-colors group relative">${tooltip}</div>`;
            });

            let sHtml = `
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-sm font-bold text-slate-400 flex items-center gap-2 mb-1"><i class="fa-solid fa-weight-scale"></i> Current Weight</h3>
                        <p class="text-xs text-slate-500">Starting point: 56.2 kg</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" step="0.1" value="${state.weight}" onchange="app.setWeight(this.value)" class="bg-slate-800 border border-slate-700 text-white text-xl font-black rounded-lg w-24 text-center py-2 outline-none">
                        <span class="text-slate-400 font-bold">kg</span>
                    </div>
                </div>

                ${isSunday ? `
                <div class="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-blue-500/30 p-5 rounded-2xl flex items-start gap-4 mb-6">
                    <div class="bg-blue-500/20 p-3 rounded-full shrink-0"><i class="fa-solid fa-camera text-blue-400 text-xl"></i></div>
                    <div>
                        <h3 class="font-bold text-white text-base mb-1">Sunday Check-in Required</h3>
                        <p class="text-sm text-slate-300">It's time to take your weekly front and side progress photos and measure your waist.</p>
                    </div>
                </div>` : ''}

                <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800 overflow-hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-bullseye text-orange-400"></i> 90-Day Journey</h2>
                        <span class="text-[10px] font-bold bg-slate-800 text-slate-400 px-2 py-1 rounded-full">${daysActive}/90 Days Logged</span>
                    </div>
                    ${daysActive === 0 ? `
                        <div class="text-center py-10">
                            <i class="fa-solid fa-calendar text-4xl text-slate-700 mb-3 block"></i>
                            <p class="text-slate-400 text-sm font-bold">Start checking off tasks today to build your heat map.</p>
                        </div>
                    ` : `
                        <div class="flex flex-wrap gap-1.5 justify-start">${gridHtml}</div>
                    `}
                </section>
            `;
            document.getElementById('app-content').innerHTML = sHtml;
        }

        // --- 6. CORE RENDER ENGINE ---
        function renderApp() {
            renderHeader();
            renderNav();
            
            if (state.activeTab === 'daily') renderDaily();
            else if (state.activeTab === 'diet') renderDiet();
            else if (state.activeTab === 'workout') renderWorkout();
            else if (state.activeTab === 'stats') renderStats();
        }

        // --- INIT ---
        renderApp();

        // Refresh Daily View every minute to unlock time-based tasks automatically
        setInterval(() => {
            if (state.activeTab === 'daily' && state.strictMode) {
                renderDaily();
            }
        }, 60000);

    </script>
</body>
</html>
