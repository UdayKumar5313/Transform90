        // --- API & AUDIO ---

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = true;
        document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

        function playTone(freq, type, duration, vol=0.1) {
            if (!soundEnabled || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const sfx = {
            success: () => { playTone(440, 'sine', 0.1, 0.1); setTimeout(() => playTone(554.37, 'sine', 0.1, 0.1), 100); setTimeout(() => playTone(659.25, 'sine', 0.4, 0.15), 200); },
            click: () => playTone(300, 'triangle', 0.05, 0.05),
            tick: () => playTone(800, 'sine', 0.05, 0.02),
            alarm: () => { playTone(880, 'square', 0.2, 0.1); setTimeout(() => playTone(880, 'square', 0.2, 0.1), 300); setTimeout(() => playTone(880, 'square', 0.4, 0.1), 600); }

        // --- 1. DATA STRUCTURES ---

            { id: 't9', time: '5:00 PM', activity: 'Workout', details: 'Follow workout schedule + 500ml water', linked: 'workout', icon: 'fa-dumbbell text-slate-300' },
            { id: 't10', time: '6:00 PM', activity: 'Post-Workout', details: '3 boiled eggs', linked: 'n8', icon: 'fa-utensils text-orange-400' },

            { id: 'n5', title: 'Lunch', time: '1:30 PM', target: '~35g Protein', icon: 'fa-bowl-rice text-orange-400', items: [{ id: 'i12', name: 'Cooked Rice', qty: '250 g', pro: 0, cal: 325, water: 0 }, { id: 'i13', name: 'Dal', qty: '150 g', pro: 5, cal: 150, water: 0 }, { id: 'i14', name: 'Vegetables', qty: '1 Bowl', pro: 0, cal: 50, water: 0 }, { id: 'i15', name: 'Soya Chunks (raw)', qty: '60 g', pro: 30, cal: 200, water: 0 }, { id: 'i16', name: 'Curd', qty: '100 g', pro: 0, cal: 60, water: 0 }, { id: 'i17', name: 'Water (Lunch)', qty: '300 ml', pro: 0, cal: 0, water: 300 }]},
            { id: 'n6', title: 'Afternoon Hydration', time: '3:00 PM', icon: 'fa-droplet text-blue-400', items: [{ id: 'i18', name: 'Water (Afternoon)', qty: '500 ml', pro: 0, cal: 0, water: 500 }]},
            { id: 'n7', title: 'Pre-Workout', time: '4:30 PM', icon: 'fa-fire text-orange-500', items: [{ id: 'i19', name: 'Banana', qty: '1', pro: 1, cal: 105, water: 0 }, { id: 'i20', name: 'Black Coffee', qty: '1 cup', pro: 0, cal: 5, water: 0 }]},
            { id: 'n8', title: 'Post-Workout', time: '6:00 PM', target: '18g Protein', icon: 'fa-dumbbell text-slate-300', items: [{ id: 'i21', name: 'Boiled Eggs', qty: '3', pro: 18, cal: 210, water: 0 }, { id: 'i_w_w', name: 'Water (Workout)', qty: '500 ml', pro: 0, cal: 0, water: 500 }]},
            { id: 'n9', title: 'Dinner', time: '8:30 PM', target: '~25g Protein', icon: 'fa-utensils text-orange-400', items: [{ id: 'i23', name: 'Cooked Rice', qty: '200 g', pro: 0, cal: 260, water: 0 }, { id: 'i24', name: 'Dal', qty: '150 g', pro: 7, cal: 150, water: 0 }, { id: 'i25', name: 'Vegetables', qty: '1 Bowl', pro: 0, cal: 50, water: 0 }, { id: 'i26', name: 'Eggs', qty: '3', pro: 18, cal: 210, water: 0 }, { id: 'i27', name: 'Water (Dinner)', qty: '200 ml', pro: 0, cal: 0, water: 200 }]},
            { id: 'n10', title: 'Before Bed', time: '10:00 PM', icon: 'fa-moon text-indigo-300', items: [{ id: 'i28', name: 'Curd', qty: '100 g', pro: 0, cal: 60, water: 0 }, { id: 'i29', name: 'Water (Before Bed)', qty: '300 ml', pro: 0, cal: 0, water: 300 }]}
        ];

        const GROCERY_LIST = [
            { category: 'Proteins', items: ['Eggs (Tray of 30+)', 'Soya Chunks (500g)', 'Milk (3-4 Liters/week)', 'Curd (1.5kg/week)'] },
            { category: 'Carbs & Fats', items: ['Oats (1kg)', 'White/Brown Rice', 'Dal / Lentils (1kg)', 'Peanuts (250g)', 'Almonds (100g)'] },
            { category: 'Produce', items: ['Bananas (Dozen)', 'Apples', 'Mixed Vegetables'] },
            { category: 'Extras', items: ['Black Coffee Powder'] }
        ];

        const BASE_WORKOUTS = {
            Monday: { focus: 'Chest + Shoulders + Triceps', duration: '60 min', note: 'Rest 60–90 sec between sets.', routine: [{ id: 'w_m1', name: 'Push-ups', sets: 4, reps: '10' }, { id: 'w_m2', name: 'Incline Push-ups', sets: 3, reps: '12' }, { id: 'w_m3', name: 'Pike Push-ups', sets: 3, reps: '8' }, { id: 'w_m4', name: 'Chair Dips', sets: 3, reps: '10' }, { id: 'w_m5', name: 'Water Bottle Lateral Raises', sets: 3, reps: '15' }, { id: 'w_m6', name: 'Plank', sets: 3, reps: '45 sec' }]},
            Tuesday: { focus: 'Back + Biceps', duration: '60 min', note: 'Use a backpack filled with books.', routine: [{ id: 'w_t1', name: 'Backpack Rows', sets: 4, reps: '12' }, { id: 'w_t2', name: 'Towel Rows', sets: 3, reps: '12' }, { id: 'w_t3', name: 'Backpack Curls', sets: 3, reps: '15' }, { id: 'w_t4', name: 'Superman Hold', sets: 3, reps: '30 sec' }, { id: 'w_t5', name: 'Dead Hangs', sets: 3, reps: 'Max Time' }]},
            Wednesday: { focus: 'Legs + Abs', duration: '60 min', note: 'Rest 60–90 sec between sets.', routine: [{ id: 'w_w1', name: 'Squats', sets: 4, reps: '20' }, { id: 'w_w2', name: 'Lunges', sets: 3, reps: '12/leg' }, { id: 'w_w3', name: 'Glute Bridges', sets: 3, reps: '15' }, { id: 'w_w4', name: 'Calf Raises', sets: 4, reps: '25' }, { id: 'w_w5', name: 'Leg Raises', sets: 3, reps: '15' }, { id: 'w_w6', name: 'Bicycle Crunches', sets: 3, reps: '20' }]},
            Thursday: { focus: 'Walking/Cardio', duration: '45 min', note: 'Cardio Focus.', routine: [{ id: 'w_th1', name: 'Brisk Walk', sets: 1, reps: '45 min' }, { id: 'w_th2', name: 'OR Light Jog', sets: 1, reps: '20 min' }]},
            Friday: { focus: 'Upper Body', duration: '60 min', note: 'Rest 60–90 sec between sets.', routine: [{ id: 'w_f1', name: 'Push-ups', sets: 5, reps: '12' }, { id: 'w_f2', name: 'Pike Push-ups', sets: 4, reps: '10' }, { id: 'w_f3', name: 'Backpack Rows', sets: 4, reps: '15' }, { id: 'w_f4', name: 'Chair Dips', sets: 4, reps: '12' }, { id: 'w_f5', name: 'Lateral Raises', sets: 4, reps: '15' }, { id: 'w_f6', name: 'Plank', sets: 3, reps: '60 sec' }]},
            Saturday: { focus: 'Cardio + Abs', duration: '45 min', note: 'Cardio first, then Abs.', routine: [{ id: 'w_s1', name: 'Brisk Walking/Jogging', sets: 1, reps: '40 min' }, { id: 'w_s2', name: 'Leg Raises', sets: 3, reps: '15' }, { id: 'w_s3', name: 'Russian Twists', sets: 3, reps: '20' }, { id: 'w_s4', name: 'Plank', sets: 3, reps: '60 sec' }]},
            Sunday: { focus: 'Rest', duration: 'Recovery', note: 'Recover and prepare for next week.', routine: [{ id: 'w_su1', name: 'Rest & Recovery', sets: '-', reps: '-' }]}
        };
        const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        // --- 2. STATE MANAGEMENT ---
        const state = {
            activeTab: 'daily', currentWeek: 1, strictMode: true,
            completedTasks: new Set(), consumedDiet: new Set(), completedSets: new Set(),
            energyLevel: 0, sleepBed: '22:30', sleepWake: '06:30', steps: 0, weight: 56.2,
            workoutDay: DAYS_OF_WEEK[new Date().getDay()], history: {}, photos: [],
            restTimer: 0, timerInterval: null, showGrocery: false,
            isAIOpen: false,
            aiMessages: [{ role: 'model', text: "Hi Uday! I monitor your live checkboxes. Ask me what you've eaten today, or what alternatives you can use for your planned foods!" }]
        };

        // --- 3. FIREBASE CLOUD SETUP ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'uday-90-day-tracker';
        let db, auth, currentUser = null;

        async function initCloud() {
            try {
                if (typeof __firebase_config !== 'undefined') {
                    const firebaseConfig = JSON.parse(__firebase_config); const firebaseApp = initializeApp(firebaseConfig);
                    auth = getAuth(firebaseApp); db = getFirestore(firebaseApp);
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } 
                    else { await signInAnonymously(auth); }
                    onAuthStateChanged(auth, async (user) => {
                        if (user) { currentUser = user; await loadFromCloud(); document.getElementById('cloud-loader').style.display = 'none'; renderApp(); }
                    });
                } else { document.getElementById('cloud-loader').style.display = 'none'; renderApp(); }
            } catch (e) { document.getElementById('cloud-loader').innerHTML = "<h2 class='text-red-500 font-bold'>Cloud Connection Failed</h2><p class='text-white mt-2'>Running local memory mode.</p>"; setTimeout(() => {document.getElementById('cloud-loader').style.display = 'none'; renderApp();}, 1500) }
        }

        async function loadFromCloud() {
            if (!currentUser || !db) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'appData', 'trackerState');
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                const data = snap.data();
                state.completedTasks = new Set(data.completedTasks || []); state.consumedDiet = new Set(data.consumedDiet || []); state.completedSets = new Set(data.completedSets || []);
                state.energyLevel = data.energyLevel || 0; state.sleepBed = data.sleepBed || '22:30'; state.sleepWake = data.sleepWake || '06:30';
                state.steps = data.steps || 0; state.weight = data.weight || 56.2;
                state.history = data.history || {}; state.currentWeek = data.currentWeek || 1;
                if(data.strictMode !== undefined) state.strictMode = data.strictMode;
            }
            try {
                const photoCol = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'photos');
                const photoSnap = await getDocs(photoCol);
                state.photos = []; photoSnap.forEach(doc => state.photos.push(doc.data()));
                state.photos.sort((a,b) => a.timestamp - b.timestamp);
            } catch(e) { console.error("Could not load photos"); }
        }

        async function syncToCloud() {
            if (!currentUser || !db) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'appData', 'trackerState');
            const dataToSave = {
                completedTasks: Array.from(state.completedTasks), consumedDiet: Array.from(state.consumedDiet), completedSets: Array.from(state.completedSets),
                energyLevel: state.energyLevel, sleepBed: state.sleepBed, sleepWake: state.sleepWake, steps: state.steps,
                weight: state.weight, history: state.history, currentWeek: state.currentWeek, strictMode: state.strictMode
            };
            try { await setDoc(docRef, dataToSave); } catch (e) { console.error("Save error:", e); }
        }

        // --- 4. CORE UTILITIES ---
        function hasTimePassed(timeString) {
            if (!timeString || !timeString.includes(':')) return true;
            const now = new Date(); const parts = timeString.split(' ');
            if(parts.length < 2) return true;
            let [hours, minutes] = parts[0].split(':'); hours = parseInt(hours, 10); minutes = parseInt(minutes, 10);
            if (hours === 12 && parts[1] === 'AM') hours = 0; if (hours !== 12 && parts[1] === 'PM') hours += 12;
            const taskTime = new Date(); taskTime.setHours(hours, minutes, 0, 0);
            return now >= taskTime;
        }

        function getDynamicWorkouts(week) {
            const dynamic = JSON.parse(JSON.stringify(BASE_WORKOUTS));
            Object.keys(dynamic).forEach(day => {
                const workout = dynamic[day]; if (workout.focus === 'Rest' || workout.focus === 'Cardio' || workout.focus === 'Walking/Cardio') return;
                workout.routine.forEach(ex => {
                    if (week >= 3) { if (ex.reps.includes('/leg')) ex.reps = `${parseInt(ex.reps) + 2}/leg`; else if (!ex.reps.includes('sec') && !ex.reps.includes('Max') && !ex.reps.includes('min')) ex.reps = `${parseInt(ex.reps) + 2}`; }
                    if (week >= 5) { if (['Squats', 'Lunges', 'Glute Bridges', 'Calf Raises', 'Towel Rows'].includes(ex.name)) ex.name += ' 🎒 (+Wt)'; }
                    if (week >= 7) ex.sets = parseInt(ex.sets) + 1;
                });
                workout.restTimer = week >= 9 ? 45 : 60;
                if(week >= 9) workout.note = "Reduce rest times to 45s.";
                if(week >= 11) workout.note = "MAXIMUM EFFORT. Empty the tank.";
            });
            return dynamic;
        }

        function isTaskDone(task) {
            if (task.linked === 'workout') {
                const todayWorkout = getDynamicWorkouts(state.currentWeek)[DAYS_OF_WEEK[new Date().getDay()]];
                if (todayWorkout.focus === 'Rest' || todayWorkout.focus === 'Cardio' || todayWorkout.focus === 'Walking/Cardio') return state.completedTasks.has(task.id);
                let totalSets = 0, doneSets = 0;
                todayWorkout.routine.forEach(ex => { if(ex.sets !== '-') { for(let i=0; i<ex.sets; i++) { totalSets++; if(state.completedSets.has(`${ex.id}_${i}`)) doneSets++; } } });
                return totalSets > 0 && totalSets === doneSets;
            } else if (task.linked) {
                const group = NUTRITION_PLAN.find(n => n.id === task.linked);
                if (!group) return false;
                return group.items.every(item => state.consumedDiet.has(item.id));
            }
            return state.completedTasks.has(task.id);
        }

        function calculateScore() {
            const isolatedTasks = TIMETABLE.filter(t => !t.linked);
            let doneIsolated = 0; isolatedTasks.forEach(t => { if(state.completedTasks.has(t.id)) doneIsolated++; });
            const taskScore = (doneIsolated / isolatedTasks.length) * 10;
            let totalDietItems = 0; NUTRITION_PLAN.forEach(n => totalDietItems += n.items.length);
            const dietScore = (state.consumedDiet.size / totalDietItems) * 45; 
            const todayWorkout = getDynamicWorkouts(state.currentWeek)[DAYS_OF_WEEK[new Date().getDay()]];
            let totalSets = 0; todayWorkout.routine.forEach(ex => totalSets += (ex.sets !== '-' ? ex.sets : 0));
            // FIX: If it is a rest day (totalSets === 0), require the task 't9' (Workout slot) to be checked off to earn the 30 points.
            const workoutScore = totalSets > 0 ? (state.completedSets.size / totalSets) * 30 : (state.completedTasks.has('t9') ? 30 : 0); 
            const stepScore = Math.min((state.steps / 8000) * 15, 15);
            return Math.min(100, taskScore + dietScore + workoutScore + stepScore);
        }

        function updateHistory() {
            const todayStr = new Date().toISOString().split('T')[0];
            state.history[todayStr] = { score: calculateScore(), weight: state.weight, energyLevel: state.energyLevel, steps: state.steps };
        }

        function compressImageFile(file) {
            return new Promise((resolve) => {
                if (!file) { resolve(null); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 450; let scale = 1;
                        if(img.width > MAX_WIDTH) scale = MAX_WIDTH / img.width;

                            <div class="flex-1"><label class="text-[10px] uppercase text-slate-500 font-bold">Wake Time</label><input type="time" value="${state.sleepWake}" onchange="app.setSleepWake(this.value)" class="w-full bg-slate-800 text-white rounded p-2 text-sm outline-none border border-slate-700"></div>
                        </div>
                    </section>
                </div>
                
                <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
                    <h2 class="text-lg font-bold mb-6 flex items-center gap-2 text-white"><i class="fa-solid fa-list-check text-emerald-400"></i> Daily Timetable</h2>
                    <div class="relative border-l-2 border-slate-800/80 ml-4 space-y-6 pb-2">
                        ${TIMETABLE.map(item => {
                            const isDone = isTaskDone(item); const isLocked = state.strictMode && !hasTimePassed(item.time);
                            return `<div class="relative pl-6 flex items-start gap-3 group">
                                <button onclick="${!isLocked ? `app.toggleTask('${item.id}')` : ''}" ${isLocked ? 'disabled' : ''} class="absolute -left-[11px] top-0.5 rounded-full p-1 transition-all z-10 bg-slate-900 border-2 ${isLocked ? 'border-slate-800 text-slate-700 opacity-60' : isDone ? 'border-emerald-500 text-emerald-500 scale-110 shadow-[0_0_10px_rgba(16,185,129,0.3)]' : 'border-slate-600 text-slate-600 hover:border-slate-500'}"><i class="fa-solid ${isLocked ? 'fa-lock text-[10px]' : isDone ? 'fa-circle-check text-xs' : 'fa-circle text-xs'}"></i></button>
                                <div class="flex-1 transition-all ${isLocked ? 'opacity-40 grayscale' : isDone ? 'opacity-50' : 'opacity-100'}">
                                    <div class="flex flex-wrap items-center gap-2 mb-1"><span class="text-[10px] sm:text-xs font-bold text-slate-300 bg-slate-800 px-2 py-1 rounded-md">${item.time}</span><h3 class="text-sm sm:text-base font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid ${item.icon} text-sm"></i> ${item.activity}</h3></div>
                                    <p class="text-xs sm:text-sm text-slate-400 mt-1">${item.details}</p>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </section>
            `;
        }

        function renderDiet() {
            if (state.showGrocery) {
                document.getElementById('app-content').innerHTML = `
                    <button onclick="app.toggleGrocery(false)" class="text-emerald-400 text-sm font-bold flex items-center gap-2 mb-4 hover:underline">&larr; Back to Timed Nutrition</button>
                    <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                        <h2 class="text-2xl font-black text-white flex items-center gap-3 mb-6"><i class="fa-solid fa-cart-shopping text-emerald-500"></i> Weekly Grocery List</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${GROCERY_LIST.map(sec => `<div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50"><h3 class="font-bold text-slate-200 mb-3 border-b border-slate-700 pb-2">${sec.category}</h3><ul class="space-y-2">${sec.items.map(i => `<li class="flex items-center gap-2 text-sm text-slate-300"><i class="fa-solid fa-list-check text-emerald-500"></i> ${i}</li>`).join('')}</ul></div>`).join('')}
                        </div>
                    </div>`;
                return;
            }

            let totalPro = 0, totalCal = 0, totalWater = 0;
            NUTRITION_PLAN.forEach(n => { n.items.forEach(i => { if (state.consumedDiet.has(i.id)) { totalPro += i.pro; totalCal += i.cal; totalWater += i.water; } }); });

            document.getElementById('app-content').innerHTML = `
                <div class="bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                    <div>
                        <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Live Intake</h3>
                        <div class="flex gap-4 sm:gap-6">
                            <div class="flex flex-col"><span class="text-2xl sm:text-3xl font-black text-red-400">${totalPro}<span class="text-[10px] sm:text-xs font-bold text-slate-500 ml-1">/110g</span></span><span class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase">Protein</span></div>
                            <div class="flex flex-col"><span class="text-2xl sm:text-3xl font-black text-orange-400">${totalCal}<span class="text-[10px] sm:text-xs font-bold text-slate-500 ml-1">/1800</span></span><span class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase">Calories</span></div>
                            <div class="flex flex-col"><span class="text-2xl sm:text-3xl font-black text-blue-400">${totalWater}<span class="text-[10px] sm:text-xs font-bold text-slate-500 ml-1">/3.3L</span></span><span class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase">Water</span></div>
                        </div>
                    </div>
                    <button onclick="app.toggleGrocery(true)" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-colors"><i class="fa-solid fa-cart-shopping"></i> Grocery</button>
                </div>
                
                <div class="relative border-l-2 border-slate-800/80 ml-2 sm:ml-4 space-y-6 pb-2">
                    ${NUTRITION_PLAN.map(n => {
                        const isLocked = state.strictMode && !hasTimePassed(n.time);
                        return `
                        <div class="relative pl-4 sm:pl-6 ${isLocked ? 'opacity-40 grayscale' : ''}">
                            <div class="absolute -left-[9px] top-1.5 w-4 h-4 bg-slate-900 border-2 border-slate-700 rounded-full"></div>
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-[10px] sm:text-xs font-bold bg-slate-800 text-slate-300 px-2 py-1 rounded">${n.time} ${isLocked ? '<i class="fa-solid fa-lock ml-1 text-[9px]"></i>' : ''}</span>
                                <h3 class="text-sm sm:text-base font-bold text-white uppercase tracking-wider flex items-center gap-2"><i class="fa-solid ${n.icon}"></i> ${n.title}</h3>
                                ${n.target ? `<span class="text-[9px] sm:text-[10px] font-bold bg-slate-950 text-emerald-400 px-2 py-0.5 rounded border border-slate-800 hidden sm:inline-block ml-auto">${n.target}</span>` : ''}
                            </div>
                            <div class="space-y-2">
                                ${n.items.map(item => {
                                    const isDone = state.consumedDiet.has(item.id);
                                    return `
                                    <button onclick="${!isLocked ? `app.toggleDiet('${item.id}')` : ''}" ${isLocked ? 'disabled' : ''} class="w-full flex items-center justify-between p-2.5 sm:p-3 rounded-xl transition-colors border ${isDone ? 'bg-emerald-900/20 border-emerald-900/50' : 'bg-slate-800/30 border-slate-700/50 hover:bg-slate-800/70'}">
                                        <div class="flex items-center gap-3">
                                            <i class="fa-solid ${isDone ? 'fa-circle-check text-emerald-500' : 'fa-circle text-slate-600'} text-base sm:text-lg"></i>
                                            <div class="text-left flex flex-col">
                                                <span class="text-xs sm:text-sm font-bold ${isDone ? 'text-slate-400' : 'text-slate-200'}">${item.name}</span>
                                                <span class="text-[10px] text-slate-500 font-medium">${item.qty}</span>
                                            </div>
                                        </div>
                                        <div class="flex gap-2 sm:gap-3 text-[10px] sm:text-xs font-bold">
                                            ${item.water > 0 ? `<span class="text-blue-400">${item.water}ml</span>` : ''}
                                            ${item.cal > 0 ? `<span class="text-orange-400 w-10 text-right">${item.cal}kc</span>` : ''}
                                            ${item.pro > 0 ? `<span class="text-red-400 w-8 text-right">${item.pro}g</span>` : ''}
                                        </div>
                                    </button>`;
                                }).join('')}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        function renderWorkout() {
            const dynamicWorkouts = getDynamicWorkouts(state.currentWeek); const workout = dynamicWorkouts[state.workoutDay];
            document.getElementById('app-content').innerHTML = `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between mb-6"><div><h3 class="font-bold text-slate-200 text-sm">Progression Phase</h3><p class="text-[10px] text-slate-400">Controls sets, reps, and rest timers.</p></div>
                    <select onchange="app.setWeek(this.value)" class="bg-slate-800 text-emerald-400 border border-slate-700 rounded-lg px-3 py-2 text-sm font-bold outline-none">${[1,3,5,7,9,11].map(w => `<option value="${w}" ${state.currentWeek===w?'selected':''}>Weeks ${w}-${w+1}</option>`).join('')}</select>
                </div>
                <div class="flex overflow-x-auto pb-2 -mx-4 px-4 md:mx-0 md:px-0 snap-x hide-scrollbar gap-2 mb-4">
                    ${Object.keys(dynamicWorkouts).map(day => `<button onclick="app.setWorkoutDay('${day}')" class="snap-center shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition-all ${state.workoutDay === day ? 'bg-emerald-500 text-slate-950 border-emerald-500' : 'bg-slate-900 text-slate-400 border-slate-700 hover:bg-slate-800'}">${day.substring(0,3).toUpperCase()}</button>`).join('')}
                </div>
                <section class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden"><div class="p-5 border-b border-slate-800 bg-slate-800/30"><h2 class="text-xl font-black text-white mb-1">${state.workoutDay} <span class="text-emerald-400">•</span> ${workout.focus}</h2>
                    <div class="flex flex-wrap gap-3 text-xs font-bold text-slate-400 mt-2"><span><i class="fa-solid fa-stopwatch mr-1 text-blue-400"></i> Duration: ${workout.duration}</span><span><i class="fa-solid fa-bolt mr-1 text-orange-400"></i> Rest: ${workout.restTimer}s</span></div>
                    <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg mt-4 text-sm text-slate-300 font-medium"><i class="fa-solid fa-circle-info text-blue-400 mr-1"></i> ${workout.note}</div>
                    </div>
                    <div class="p-4 sm:p-5 space-y-4">
                        ${workout.routine.length > 0 ? workout.routine.map(ex => {
                            let setsHtml = '';
                            if (ex.sets !== '-') { for(let i=0; i<ex.sets; i++) { const setId = `${ex.id}_${i}`; const isDone = state.completedSets.has(setId); setsHtml += `<button onclick="app.toggleSet('${ex.id}', ${i}, ${workout.restTimer})" class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold border transition-all flex-1 min-w-[60px] ${isDone ? 'bg-emerald-900/40 border-emerald-500/50 text-emerald-400' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}">${isDone ? '<i class="fa-solid fa-check"></i>' : `Set ${i+1}`}</button>`; } }
                            return `<div class="bg-slate-800/40 rounded-xl border border-slate-700/50 p-4">
                                <div class="flex justify-between items-start mb-2"><h3 class="font-bold text-slate-100 text-sm sm:text-base">${ex.name}</h3><span class="bg-slate-950 text-slate-300 text-[10px] sm:text-xs font-bold px-2 py-1 rounded whitespace-nowrap border border-slate-800">${ex.sets !== '-' ? ex.sets + ' Sets x ' : ''}${ex.reps}</span></div>
                                ${ex.tips ? `<p class="text-[11px] sm:text-xs text-slate-400 mb-4 bg-slate-900/50 p-2 rounded">${ex.tips}</p>` : ''}
                                ${ex.sets !== '-' ? `<div class="flex flex-wrap gap-2">${setsHtml}</div>` : ''}</div>`;
                        }).join('') : '<div class="text-center py-8 text-slate-500">Rest Day. No tracked sets.</div>'}
                    </div></section>`;
        }

        function renderStats() {
            const todayStr = new Date().toISOString().split('T')[0];
            const isSunday = new Date().getDay() === 0; 
            const daysArray = Array.from({ length: 90 }, (_, i) => i + 1);
            const historyKeys = Object.keys(state.history).sort(); 
            const daysActive = historyKeys.length;
            
            const photoTakenToday = state.photos.some(p => p.date === todayStr);

            let gridHtml = '';
            daysArray.forEach(dayNum => {
                let bgColor = "bg-slate-800/30"; let borderColor = "border-slate-800/50"; let tooltip = '';
                if (dayNum <= daysActive) {
                    const data = state.history[historyKeys[dayNum - 1]];
                    if(data) {
                        if (data.score > 85) { bgColor = "bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"; borderColor = "border-emerald-400"; }
                        else if (data.score > 50) { bgColor = "bg-emerald-600/80"; borderColor = "border-emerald-500"; }
                        else if (data.score > 10) { bgColor = "bg-emerald-900/60"; borderColor = "border-emerald-800"; }
                        tooltip = `<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block z-20"><div class="bg-slate-800 text-white text-[10px] font-bold py-1 px-2 rounded shadow-xl whitespace-nowrap">Day ${dayNum} • Score: ${Math.round(data.score)}%</div></div>`;
                    }
                }
                gridHtml += `<div class="w-[18px] h-[18px] rounded-[4px] border ${bgColor} ${borderColor} transition-colors group relative">${tooltip}</div>`;
            });

            let galleryHtml = '';
            if (state.photos.length > 0) {
                const day1 = state.photos[0]; const latest = state.photos[state.photos.length - 1]; let waistDiffHtml = '';
                if(day1.waist && latest.waist && day1.waist !== latest.waist) {
                    const diff = (latest.waist - day1.waist).toFixed(1);
                    waistDiffHtml = `<div class="mt-4 bg-slate-950 p-3 rounded-lg border border-slate-800 text-center"><span class="text-xs text-slate-400 font-bold uppercase block mb-1">Waist Change</span><span class="text-lg font-black ${diff < 0 ? 'text-emerald-400' : 'text-red-400'}">${diff} cm</span></div>`;
                }
                galleryHtml = `
                    <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800 mb-6">
                        <h2 class="text-base font-bold text-white flex items-center gap-2 mb-4"><i class="fa-solid fa-images text-blue-400"></i> Transformation Gallery</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div><div class="text-[10px] uppercase font-bold text-slate-400 mb-2">Day 1 (${day1.date})</div>${day1.front ? `<img src="${day1.front}" class="w-full rounded-xl border border-slate-700 object-cover aspect-[3/4] bg-slate-950">` : `<div class="w-full aspect-[3/4] bg-slate-800 rounded-xl border border-slate-700 flex items-center justify-center text-xs text-slate-500">No Image</div>`}</div>
                            <div><div class="text-[10px] uppercase font-bold text-emerald-400 mb-2">Latest (${latest.date})</div>${latest.front ? `<img src="${latest.front}" class="w-full rounded-xl border border-emerald-900 object-cover aspect-[3/4] bg-slate-950">` : `<div class="w-full aspect-[3/4] bg-slate-800 rounded-xl border border-slate-700 flex items-center justify-center text-xs text-slate-500">No Image</div>`}</div>
                        </div>${waistDiffHtml}
                    </section>`;
            }

            document.getElementById('app-content').innerHTML = `
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center mb-6"><div><h3 class="text-sm font-bold text-slate-400 flex items-center gap-2 mb-1"><i class="fa-solid fa-weight-scale text-orange-400"></i> Weight Tracking</h3><p class="text-xs text-slate-500">Starting point: 56.2 kg</p></div><div class="flex items-center gap-2"><input type="number" step="0.1" value="${state.weight}" onchange="app.setWeight(this.value)" class="bg-slate-800 border border-slate-700 text-white text-xl font-black rounded-lg w-24 text-center py-2 outline-none"><span class="text-slate-400 font-bold">kg</span></div></div>
                
                ${isSunday && !photoTakenToday ? `<div class="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-blue-500/50 p-5 rounded-2xl flex flex-col items-center text-center gap-3 mb-6 shadow-[0_0_20px_rgba(59,130,246,0.15)]"><div class="bg-blue-500 p-3 rounded-full shrink-0 shadow-lg"><i class="fa-solid fa-camera text-white text-xl"></i></div><div><h3 class="font-black text-white text-lg mb-1">Sunday Check-in Required</h3><p class="text-xs sm:text-sm text-slate-300 font-medium max-w-md">Take your weekly front & side progress photos and measure your waist to visually track your 90-day transformation.</p></div><button onclick="app.openCameraModal()" class="mt-2 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-lg"><i class="fa-solid fa-plus mr-2"></i> Log Progress Photos</button></div>` 
                : photoTakenToday ? `<div class="bg-emerald-900/20 border border-emerald-500/30 p-4 rounded-2xl flex items-center gap-4 mb-6"><div class="bg-emerald-500/20 p-2 rounded-full text-emerald-400"><i class="fa-solid fa-check"></i></div><div><h3 class="font-bold text-emerald-400 text-sm">Progress Logged Today</h3><p class="text-xs text-slate-400">Great job staying accountable.</p></div></div>` 
                : `<div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between gap-4 mb-6"><div><h3 class="font-bold text-slate-200 text-sm">Progress Camera</h3><p class="text-[10px] text-slate-400">Required every Sunday.</p></div><button onclick="app.openCameraModal()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 px-4 rounded-lg border border-slate-600"><i class="fa-solid fa-camera mr-1"></i> Open</button></div>`}
                
                ${galleryHtml}

                <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800 overflow-hidden"><div class="flex justify-between items-center mb-6"><h2 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-bullseye text-orange-400"></i> 90-Day Map</h2><span class="text-[10px] font-bold bg-slate-800 text-slate-400 px-2 py-1 rounded-full">${daysActive}/90 Days</span></div>
                    ${daysActive === 0 ? `<div class="text-center py-10"><i class="fa-solid fa-calendar text-4xl text-slate-700 mb-3 block"></i><p class="text-slate-400 text-sm font-bold">Start checking off tasks today to build your map.</p></div>` : `<div class="flex flex-wrap gap-1.5 justify-start">${gridHtml}</div>`}
                </section>`;
        }

        function renderGuide() {
            document.getElementById('app-content').innerHTML = `
                <div class="space-y-6">
                    <section class="bg-gradient-to-br from-red-950 to-slate-900 p-6 rounded-2xl border border-red-900/50 relative overflow-hidden shadow-lg">
                        <i class="fa-solid fa-award text-9xl absolute -top-4 -right-4 opacity-10 text-white"></i>
                        <h2 class="text-xl font-black text-red-500 mb-3 relative z-10 uppercase tracking-wide">The Golden Rule</h2>
                        <p class="text-slate-200 text-sm md:text-base leading-relaxed mb-5 relative z-10 font-medium">Missing one day doesn't matter. Missing weeks does. Consistency for 6–12 months is what will get you close to that edited physique.</p>
                        <div class="space-y-2.5 relative z-10 bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                            <p class="font-bold text-white text-[10px] sm:text-sm uppercase tracking-wider mb-2 sm:mb-3">NEVER MISS:</p>
                            ${['Protein target (100 g)', 'Workout', 'Sleep', 'Water'].map(rule => `<div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-bold text-slate-300"><i class="fa-solid fa-circle-check text-emerald-500"></i> ${rule}</div>`).join('')}
                        </div>
                    </section>
                    <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
                        <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-white"><i class="fa-solid fa-chart-line text-blue-400"></i> Expected Results</h2>
                        <div class="relative border-l-2 border-slate-700 ml-3 space-y-6 pb-2">
                            ${[{ t: '30 Days', c: 'Better energy, tighter waist' }, { t: '60 Days', c: 'Visible chest and shoulder improvement' }, { t: '90 Days', c: 'Noticeable transformation' }, { t: '180 Days', c: 'Close to the physique in the edited image' }, { t: '365 Days', c: 'Lean athletic physique if consistent' }].map(res => `<div class="relative pl-6"><div class="absolute -left-[7px] top-1 w-3 h-3 bg-blue-500 rounded-full border-[3px] border-slate-900 shadow-[0_0_10px_rgba(59,130,246,0.6)]"></div><div class="font-black text-white text-base mb-1">${res.t}</div><div class="text-sm font-medium text-slate-400">${res.c}</div></div>`).join('')}
                        </div>
                    </section>
                    <section class="bg-slate-900 rounded-2xl p-5 border border-slate-800">
                        <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-white"><i class="fa-solid fa-arrow-trend-up text-emerald-400"></i> Progression Plan</h2>
                        <div class="space-y-3">
                            ${[{ w: 'Week 1–2', g: 'Learn exercises' }, { w: 'Week 3–4', g: 'Add 2 reps per set' }, { w: 'Week 5–6', g: 'Add backpack weight' }, { w: 'Week 7–8', g: 'Increase sets' }, { w: 'Week 9–10', g: 'Reduce rest times' }, { w: 'Week 11–12', g: 'Maximum effort' }].map(item => `<div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4 p-3 sm:p-4 bg-slate-800/40 border border-slate-700/30 rounded-xl"><div class="font-black text-emerald-400 text-xs sm:text-sm shrink-0 sm:w-24">${item.w}</div><div class="text-xs sm:text-sm font-medium text-slate-300">${item.g}</div></div>`).join('')}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderApp() { renderHeader(); renderNav(); if (state.activeTab === 'daily') renderDaily(); else if (state.activeTab === 'diet') renderDiet(); else if (state.activeTab === 'workout') renderWorkout(); else if (state.activeTab === 'stats') renderStats(); else if (state.activeTab === 'guide') renderGuide(); renderAI(); }

        initCloud();
        setInterval(() => { if (state.activeTab === 'daily' && state.strictMode) renderDaily(); }, 60000);

    </script>
</body>
</html>
